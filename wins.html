<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Победы">
<meta name="theme-color" content="#17130f">
<title>Мои победы</title>
<link rel="apple-touch-icon" href="wins-icons/icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="wins-icons/icon-192.png?v=2">
<link rel="manifest" href="wins.webmanifest">
<style>
  :root{
    --bg:#17130f; --card:#211c17; --line:#3a322a; --text:#f3ece4; --muted:#a69a8d;
    --accent:#e07a3c; --accent-soft:#3a281b; --chip-on:#f3ece4; --chip-on-text:#17130f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  [hidden]{display:none!important}
  body{
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 120px);
    max-width:640px;margin:0 auto;
  }
  header{display:flex;justify-content:space-between;align-items:center;gap:12px}
  h1{font-size:32px;font-weight:800;letter-spacing:-.5px}
  .sub{color:var(--muted);font-size:15px;margin-top:6px}
  .menu-btn{
    flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:20px;line-height:1;cursor:pointer
  }
  .head-btns{flex:none;display:flex;gap:8px}
  .menu-btn{display:grid;place-items:center}
  .search{display:none;align-items:center;gap:10px;margin-top:18px}
  .search.on{display:flex}
  .search-box{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px}
  .search-box svg{flex:none;color:var(--muted)}
  .search-box input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:16px;padding:12px 0;font-family:inherit}
  .search-box input::placeholder{color:var(--muted)}
  .search-box input::-webkit-search-cancel-button{display:none}
  .search-clear{flex:none;background:var(--line);color:var(--card);border:none;width:20px;height:20px;border-radius:50%;font-size:12px;line-height:20px;cursor:pointer;display:none}
  .search-clear.on{display:block}
  .search-cancel{flex:none;background:none;border:none;color:var(--accent);font-size:16px;cursor:pointer;font-family:inherit}
  mark{background:rgba(224,122,60,.3);color:inherit;border-radius:3px;padding:0 1px}
  /* celebration */
  .yay{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(10,8,6,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .yay.on{display:grid;animation:yay-bg 1.9s ease forwards}
  .yay-in{position:relative;text-align:center}
  .yay-star{width:96px;height:96px;margin:0 auto;animation:yay-pop .6s cubic-bezier(.2,1.6,.4,1) both}
  .yay p{margin-top:18px;font-size:22px;font-weight:700;animation:yay-text .5s .15s ease-out both}
  .yay i{position:absolute;left:50%;top:48px;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--accent);opacity:0;
    animation:yay-burst .9s cubic-bezier(.1,.7,.3,1) both;animation-delay:.1s}
  .yay i:nth-child(odd){background:#ffd2a3;width:6px;height:6px}
  @keyframes yay-pop{from{transform:scale(0) rotate(-40deg);opacity:0}}
  @keyframes yay-text{from{transform:translateY(10px);opacity:0}}
  @keyframes yay-burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}}
  @keyframes yay-bg{0%,80%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.yay *,.yay.on{animation:none!important}.yay i{display:none}}
  .hero{margin-top:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .hero b{font-size:44px;font-weight:800;letter-spacing:-1px;color:var(--accent)}
  .hero span{font-size:18px;font-weight:600}
  .hero small{flex-basis:100%;color:var(--muted);font-size:14px;margin-top:-4px}
  .memo{
    display:block;margin-top:14px;width:100%;text-align:left;font-family:inherit;color:var(--text);cursor:pointer;
    background:none;border:none;border-left:2px solid var(--accent);padding:2px 0 2px 14px
  }
  .memo-text{font-size:16px;line-height:1.45;color:#d9cfc4;white-space:pre-wrap;word-wrap:break-word}
  .memo-date{color:var(--muted);font-size:13px;margin-top:6px}
  .memo-date,.memo-text{transition:opacity .18s}
  .memo.fade .memo-date,.memo.fade .memo-text{opacity:0}
  .tip{background:var(--accent-soft);border-radius:18px;padding:16px 18px;margin-top:12px}
  .tip small{display:block;color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
  .tip p{font-size:16px;line-height:1.4}
  .chips{display:flex;gap:8px;margin-top:18px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;border:1px solid var(--line);background:transparent;color:var(--text);
    border-radius:999px;padding:9px 16px;font-size:15px;cursor:pointer
  }
  .chip.on{background:var(--chip-on);color:var(--chip-on-text);border-color:var(--chip-on)}
  #list{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .day{color:var(--muted);font-size:13px;margin:10px 4px 0}
  .win{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;display:flex;gap:10px}
  .win-body{flex:1;min-width:0}
  .win-text{font-size:16px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
  .win-meta{color:var(--muted);font-size:12px;margin-top:6px}
  .empty{text-align:center;color:var(--muted);font-size:16px;line-height:1.5;padding:40px 10px 10px}
  .ghost{
    margin-top:16px;border:1px solid var(--line);background:transparent;color:var(--text);
    border-radius:999px;padding:10px 20px;font-size:15px;cursor:pointer
  }
  /* frosted-glass strip behind the bottom button; fades in from transparent so there is no hard edge */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none;
    height:calc(env(safe-area-inset-bottom) + 120px);
    background:linear-gradient(to bottom, rgba(23,19,15,0), rgba(23,19,15,.55) 45%, rgba(23,19,15,.8));
    -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
    -webkit-mask-image:linear-gradient(to bottom, transparent, #000 45%);mask-image:linear-gradient(to bottom, transparent, #000 45%)
  }
  .fab{
    z-index:5;
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 24px);
    background:var(--accent);color:#fff;border:none;border-radius:999px;
    padding:16px 30px;font-size:18px;font-weight:700;cursor:pointer;white-space:nowrap;
    box-shadow:0 8px 30px rgba(224,122,60,.35)
  }
  /* sheets */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .backdrop.open{display:flex;animation:fade .2s ease-out}
  .backdrop.open .sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}
  .backdrop.top{align-items:flex-start}
  .backdrop.top .sheet{
    border-radius:0 0 22px 22px;border-top:none;border-bottom:1px solid var(--line);
    padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:18px
  }
  .backdrop.top.open .sheet{animation:down .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes fade{from{background:rgba(0,0,0,0)}}
  @keyframes up{from{transform:translateY(100%)}}
  @keyframes down{from{transform:translateY(-100%)}}
  body.locked{position:fixed;left:0;right:0;overflow:hidden}
  .sheet{
    width:100%;max-width:640px;background:var(--card);border-radius:22px 22px 0 0;
    padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);border-top:1px solid var(--line)
  }
  .sheet h2{font-size:20px;margin-bottom:14px}
  textarea,input[type=date]{
    width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);
    border-radius:14px;padding:12px;font-size:16px;font-family:inherit
  }
  textarea{min-height:96px;resize:vertical}
  textarea:focus,input[type=date]:focus{outline:none;border-color:rgba(224,122,60,.7)}
  input[type=date]{
    display:block;margin-top:12px;color-scheme:dark;min-width:0;max-width:100%;min-height:48px;
    -webkit-appearance:none;appearance:none;text-align:left
  }
  input[type=date]::-webkit-date-and-time-value{text-align:left}
  .sheet .chips{margin-top:12px}
  .row{display:flex;gap:10px;margin-top:16px}
  .row button{flex:1;border-radius:14px;padding:14px;font-size:16px;font-weight:600;border:none;cursor:pointer}
  .btn-main{background:var(--accent);color:#fff}
  .btn-sec{background:transparent;color:var(--text);border:1px solid var(--line)!important}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .sheet-head h2{margin:0}
  .x-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--bg);color:var(--muted);display:grid;place-items:center;cursor:pointer}
  .group{background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .group + .group{margin-top:12px}
  .mi{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:transparent;color:var(--text);
    border:none;padding:14px 16px;cursor:pointer;font-family:inherit
  }
  .mi + .mi{border-top:1px solid var(--line)}
  .mi:active{background:rgba(255,255,255,.04)}
  .mi-ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
  .mi-tx{flex:1;min-width:0}
  .mi-tx b{display:block;font-size:16px;font-weight:600}
  .mi-tx span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .mi-ch{flex:none;color:var(--line)}
  .mi.danger .mi-ic{background:rgba(240,138,122,.12);color:#f08a7a}
  .mi.danger b{color:#f08a7a}
  .btn-del{background:transparent;color:#f08a7a;border:1px solid rgba(240,138,122,.35)!important;flex:0 0 auto!important;padding:14px 16px!important}
  .win{cursor:pointer}
  .win:active{background:#272119}
  #toast{
    position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translateX(-50%);
    background:var(--chip-on);color:var(--chip-on-text);padding:10px 18px;border-radius:999px;
    font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20
  }
  #toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div>
    <h1>Мои победы ✨</h1>
  </div>
  <div class="head-btns">
    <button class="menu-btn" id="searchBtn" aria-label="Поиск" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="menu-btn" id="menuBtn" aria-label="Меню">⋯</button>
  </div>
</header>

<div class="search" id="search">
  <label class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="Найти победу" autocomplete="off" enterkeyhint="search">
    <button class="search-clear" id="qClear" type="button" aria-label="Очистить">✕</button>
  </label>
  <button class="search-cancel" id="qCancel" type="button">Отмена</button>
</div>

<section id="summary" hidden>
  <div class="hero"><b id="sTotal">0</b><span id="sWord">побед</span><small id="sSince"></small></div>
  <button class="memo" id="memo" aria-label="Показать другую победу">
    <p class="memo-text" id="memoText"></p>
    <p class="memo-date" id="memoDate"></p>
  </button>
</section>

<div class="tip" id="tipBox"><small>На сегодня</small><p id="tip"></p></div>

<nav class="chips" id="filters"></nav>
<div id="list"></div>

<div class="dock" aria-hidden="true"></div>
<button class="fab" id="addBtn">+ Записать победу</button>

<!-- add sheet -->
<div class="backdrop top" id="addSheet">
  <div class="sheet">
    <h2 id="addTitle">Новая победа</h2>
    <textarea id="wText" placeholder="Что получилось? Даже маленькое считается" maxlength="1000"></textarea>
    <nav class="chips" id="catPick"></nav>
    <input type="date" id="wDate">
    <div class="row">
      <button class="btn-del" id="delBtn" hidden>Удалить</button>
      <button class="btn-sec" data-close>Отмена</button>
      <button class="btn-main" id="saveBtn">Сохранить</button>
    </div>
  </div>
</div>

<!-- menu sheet -->
<div class="backdrop" id="menuSheet">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Резервная копия</h2>
      <button class="x-btn" data-close aria-label="Закрыть"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="pointer-events:none"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
    </div>
    <div class="group">
      <button class="mi" id="exportBtn">
        <span class="mi-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></span>
        <span class="mi-tx"><b>Сохранить копию</b><span>Все записи одним файлом</span></span>
        <svg class="mi-ch" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l6 6-6 6"/></svg>
      </button>
      <button class="mi" id="importBtn">
        <span class="mi-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span>
        <span class="mi-tx"><b>Восстановить</b><span>Добавить записи из копии, без повторов</span></span>
        <svg class="mi-ch" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="group">
      <button class="mi danger" id="wipeBtn">
        <span class="mi-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></span>
        <span class="mi-tx"><b>Удалить все записи</b><span>Без возможности вернуть</span></span>
      </button>
    </div>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
</div>

<div id="toast"></div>

<div class="yay" id="yay" aria-live="polite">
  <div class="yay-in">
    <svg class="yay-star" viewBox="0 0 100 100"><defs><linearGradient id="yg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb36b"/><stop offset="1" stop-color="#e07a3c"/></linearGradient></defs><path d="M50 4 C55 38 62 45 96 50 C62 55 55 62 50 96 C45 62 38 55 4 50 C38 45 45 38 50 4Z" fill="url(#yg)"/></svg>
    <span id="yayDots"></span>
    <p id="yayText"></p>
  </div>
</div>

<script>
(() => {
  const KEY = 'my-wins-v1';
  const CATS = ['Работа', 'Личное'];
  const normCat = c => c === 'Работа' ? 'Работа' : 'Личное';
  const TIPS = [
    'Маленький шаг — тоже шаг. Записывайте и его.',
    'Вы сделали больше, чем помните. Запишите одно.',
    'Отдых — тоже достижение.',
    'Не «ничего не сделал», а «сделал то, на что были силы».',
    'Сравнивайте себя только с собой вчерашним.',
    'Довести до конца — уже победа, даже если неидеально.',
    'Попросить о помощи — смелый поступок.',
    'Сказать «нет» лишнему — тоже результат.'
  ];
  const $ = id => document.getElementById(id);
  let wins = load();
  // migrate old categories (Учёба, Дом, Я сам…) into «Личное»
  if (wins.some(w => !CATS.includes(w.cat))) { wins.forEach(w => { w.cat = normCat(w.cat); }); try { localStorage.setItem(KEY, JSON.stringify(wins)); } catch {} }
  let filter = 'Все';
  let pickCat = CATS[0];

  function load() {
    try { const a = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(a) ? a : []; }
    catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(wins)); }
    catch { toast('Не удалось сохранить — проверьте, не приватный ли режим'); }
  }
  // ask the browser not to evict data (helps on iOS when added to Home Screen)
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // Self-update: a Home Screen app on iOS keeps the old page in cache and often just resumes it.
  // On launch and whenever the app comes back to the foreground, fetch the page bypassing the cache;
  // if a newer version is published, reload into it. Records live in localStorage and are not affected.
  const APP_VERSION = '11';
  async function checkUpdate() {
    if (location.protocol === 'file:' || document.querySelector('.backdrop.open')) return;
    try {
      const r = await fetch(location.pathname, { cache: 'reload' });
      if (!r.ok) return;
      const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
      if (!m || m[1] === APP_VERSION) return;
      let tries = 0;
      try { tries = +sessionStorage.getItem('upd-' + m[1]) || 0; sessionStorage.setItem('upd-' + m[1], tries + 1); } catch {}
      if (tries < 2) location.reload();
    } catch {}
  }
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => iso(new Date());
  const shift = (s, days) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + days); return iso(d); };
  const human = s => {
    if (s === today()) return 'Сегодня';
    if (s === shift(today(), -1)) return 'Вчера';
    return new Date(s + 'T12:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: s.slice(0,4) === today().slice(0,4) ? undefined : 'numeric' });
  };
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  const plural = n => {
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return 'победа';
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return 'победы';
    return 'побед';
  };
  const longDate = s => new Date(s + 'T12:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).replace(/\s*г\.?$/, '');
  let memoId = null;
  function showMemo(next) {
    if (!wins.length) return;
    let pool = wins.length > 1 ? wins.filter(w => w.id !== memoId) : wins;
    const w = next || !wins.some(x => x.id === memoId)
      ? pool[Math.floor(Math.random() * pool.length)]
      : wins.find(x => x.id === memoId);
    memoId = w.id;
    $('memoDate').textContent = human(w.date);
    $('memoText').textContent = '«' + w.text + '»';
  }
  function stats() {
    $('summary').hidden = !wins.length;
    $('tipBox').hidden = !!wins.length;
    if (!wins.length) return;
    $('sTotal').textContent = wins.length;
    $('sWord').textContent = plural(wins.length);
    const first = wins.reduce((m, w) => w.date < m ? w.date : m, wins[0].date);
    $('sSince').textContent = 'с ' + longDate(first);
    showMemo(false);
  }
  $('memo').onclick = () => {
    if (wins.length < 2) return;
    const m = $('memo'); m.classList.add('fade');
    setTimeout(() => { showMemo(true); m.classList.remove('fade'); }, 180);
  };

  function chips(el, items, active, onPick) {
    el.innerHTML = items.map(c => `<button class="chip${c === active ? ' on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
    el.onclick = e => { const b = e.target.closest('.chip'); if (b) onPick(b.dataset.c); };
  }

  let query = '';
  const norm = t => t.toLowerCase().replace(/ё/g, 'е');
  // highlight matches; norm() keeps string length, so indexes line up with the original text
  const hl = (text, qn) => {
    if (!qn) return esc(text);
    const low = norm(text); let out = '', i = 0, j;
    while ((j = low.indexOf(qn, i)) !== -1) { out += esc(text.slice(i, j)) + '<mark>' + esc(text.slice(j, j + qn.length)) + '</mark>'; i = j + qn.length; }
    return out + esc(text.slice(i));
  };
  $('searchBtn').onclick = () => { $('search').classList.add('on'); $('q').focus(); };
  $('q').oninput = () => { query = $('q').value; $('qClear').classList.toggle('on', !!query); render(); };
  $('q').onkeydown = e => { if (e.key === 'Enter') $('q').blur(); };
  $('qClear').onclick = () => { $('q').value = ''; $('q').oninput(); $('q').focus(); };
  $('qCancel').onclick = () => { $('q').value = ''; query = ''; $('qClear').classList.remove('on'); $('search').classList.remove('on'); $('q').blur(); render(); };

  // celebration after a new win
  const YAY = ['Ещё одна в копилку', 'Это считается!', 'Так держать', 'Записано. Вы молодец', 'Вот это да', 'Хорошая работа'];
  let yayT;
  function celebrate() {
    const el = $('yay');
    $('yayText').textContent = YAY[Math.floor(Math.random() * YAY.length)];
    let dots = '';
    for (let k = 0; k < 14; k++) {
      const a = (k / 14) * Math.PI * 2 + Math.random() * .4, r = 80 + Math.random() * 60;
      dots += `<i style="--x:${Math.round(Math.cos(a) * r)}px;--y:${Math.round(Math.sin(a) * r)}px"></i>`;
    }
    $('yayDots').innerHTML = dots;
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
    clearTimeout(yayT); yayT = setTimeout(() => el.classList.remove('on'), 1900);
  }
  $('yay').onclick = () => { clearTimeout(yayT); $('yay').classList.remove('on'); };

  function render() {
    stats();
    chips($('filters'), ['Все', ...CATS], filter, c => { filter = c; render(); });
    const qn = norm(query.trim());
    $('searchBtn').hidden = !wins.length;
    if (query.trim()) { $('summary').hidden = true; $('tipBox').hidden = true; }
    const shown = wins
      .filter(w => filter === 'Все' || w.cat === filter)
      .filter(w => !qn || norm(w.text).includes(qn))
      .sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
    const list = $('list');
    if (!shown.length) {
      list.innerHTML = qn
        ? `<p class="empty">Ничего не нашлось по «${esc(query.trim())}».</p>`
        : wins.length
        ? `<p class="empty">В категории «${esc(filter)}» пока пусто.</p>`
        : `<div class="empty">Здесь будут ваши победы.<br>Начните с того, что уже сделали.<br><button class="ghost" id="firstBtn">Записать первую</button></div>`;
      const fb = $('firstBtn'); if (fb) fb.onclick = openAdd;
      return;
    }
    let html = '', last = '';
    for (const w of shown) {
      if (w.date !== last) { html += `<p class="day">${human(w.date)}</p>`; last = w.date; }
      html += `<div class="win" data-id="${esc(w.id)}" role="button"><div class="win-body"><p class="win-text">${hl(w.text, qn)}</p><p class="win-meta">${esc(w.cat)}</p></div></div>`;
    }
    list.innerHTML = html;
  }

  $('list').addEventListener('click', e => {
    const card = e.target.closest('.win'); if (!card) return;
    const w = wins.find(x => x.id === card.dataset.id); if (w) openEdit(w);
  });

  // sheets
  // lock page scroll while a sheet is open so iOS doesn't jump the page under the keyboard
  let lockY = 0;
  const open = id => {
    if (!document.body.classList.contains('locked')) {
      lockY = window.scrollY;
      document.body.style.top = -lockY + 'px';
      document.body.classList.add('locked');
    }
    $(id).classList.add('open');
  };
  const close = id => {
    $(id).classList.remove('open');
    if (!document.querySelector('.backdrop.open')) {
      document.activeElement && document.activeElement.blur();
      document.body.classList.remove('locked');
      document.body.style.top = '';
      window.scrollTo(0, lockY);
    }
  };
  // focus synchronously inside the tap, so the keyboard opens together with the sheet (no second jump)
  const focusEnd = el => { el.focus({ preventScroll: true }); const n = el.value.length; el.setSelectionRange(n, n); };
  document.querySelectorAll('.backdrop').forEach(bd => {
    bd.addEventListener('click', e => { if (e.target === bd || e.target.hasAttribute('data-close')) close(bd.id); });
  });

  function renderPick() { chips($('catPick'), CATS, pickCat, c => { pickCat = c; renderPick(); }); }
  let editing = null;
  function openAdd() {
    editing = null;
    $('addTitle').textContent = 'Новая победа';
    $('delBtn').hidden = true;
    $('wText').value = '';
    $('wDate').value = today(); $('wDate').max = today();
    pickCat = filter !== 'Все' ? filter : pickCat;
    renderPick(); open('addSheet'); focusEnd($('wText'));
  }
  function openEdit(w) {
    editing = w;
    $('addTitle').textContent = 'Редактировать';
    $('delBtn').hidden = false;
    $('wText').value = w.text;
    $('wDate').value = w.date; $('wDate').max = today();
    pickCat = normCat(w.cat);
    renderPick(); open('addSheet'); focusEnd($('wText'));
  }
  $('delBtn').onclick = () => {
    if (!editing || !confirm('Удалить эту запись?')) return;
    wins = wins.filter(w => w !== editing); save(); close('addSheet'); render(); toast('Удалено');
  };
  $('addBtn').onclick = openAdd;
  $('saveBtn').onclick = () => {
    const text = $('wText').value.trim();
    if (!text) { toast('Напишите пару слов'); return; }
    if (editing) {
      Object.assign(editing, { text, cat: pickCat, date: $('wDate').value || editing.date });
      save(); close('addSheet'); render(); toast('Сохранено');
      return;
    }
    wins.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      text, cat: pickCat, date: $('wDate').value || today(), created: Date.now()
    });
    save(); close('addSheet'); render(); celebrate();
  };

  // backup
  $('menuBtn').onclick = () => open('menuSheet');
  $('exportBtn').onclick = async () => {
    const blob = new Blob([JSON.stringify({ app: 'my-wins', v: 1, exported: new Date().toISOString(), wins }, null, 2)], { type: 'application/json' });
    const name = `pobedy-${today()}.json`;
    const file = new File([blob], name, { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('importBtn').onclick = () => $('fileIn').click();
  $('fileIn').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const arr = Array.isArray(data) ? data : data.wins;
      if (!Array.isArray(arr)) throw 0;
      const ids = new Set(wins.map(w => w.id)); let added = 0;
      for (const w of arr) {
        if (w && typeof w.text === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(w.date) && !ids.has(w.id)) {
          wins.push({ id: String(w.id || Math.random().toString(36).slice(2)), text: w.text, cat: normCat(w.cat), date: w.date, created: +w.created || 0 });
          added++;
        }
      }
      save(); render(); close('menuSheet'); toast(`Добавлено записей: ${added}`);
    } catch { toast('Не получилось прочитать файл'); }
  };
  $('wipeBtn').onclick = () => {
    if (!wins.length) { toast('Записей и так нет'); return; }
    if (!confirm('Удалить ВСЕ записи? Сначала лучше сохранить резервную копию.')) return;
    wins = []; save(); render(); close('menuSheet'); toast('Всё удалено');
  };

  $('tip').textContent = TIPS[Math.floor(Date.now() / 864e5) % TIPS.length];
  render();
})();
</script>
</body>
</html>
